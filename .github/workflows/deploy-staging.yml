name: Deploy to Staging

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Fetch secrets from Secret Manager
        run: |
          # Database
          DATABASE_URL=$(gcloud secrets versions access latest --secret=DATABASE_URL)
          echo "DATABASE_URL=$DATABASE_URL" >> .env.production

          # Clerk Authentication
          CLERK_SECRET_KEY=$(gcloud secrets versions access latest --secret=CLERK_SECRET_KEY)
          CLERK_WEBHOOK_SECRET=$(gcloud secrets versions access latest --secret=CLERK_WEBHOOK_SECRET)
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$(gcloud secrets versions access latest --secret=NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY)
          NEXT_PUBLIC_CLERK_SIGN_IN_URL=$(gcloud secrets versions access latest --secret=NEXT_PUBLIC_CLERK_SIGN_IN_URL)
          NEXT_PUBLIC_CLERK_SIGN_UP_URL=$(gcloud secrets versions access latest --secret=NEXT_PUBLIC_CLERK_SIGN_UP_URL)
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=$(gcloud secrets versions access latest --secret=NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL)

          echo "CLERK_SECRET_KEY=$CLERK_SECRET_KEY" >> .env.production
          echo "CLERK_WEBHOOK_SECRET=$CLERK_WEBHOOK_SECRET" >> .env.production
          echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" >> .env.production
          echo "NEXT_PUBLIC_CLERK_SIGN_IN_URL=$NEXT_PUBLIC_CLERK_SIGN_IN_URL" >> .env.production
          echo "NEXT_PUBLIC_CLERK_SIGN_UP_URL=$NEXT_PUBLIC_CLERK_SIGN_UP_URL" >> .env.production
          echo "NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=$NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL" >> .env.production

          # Export NEXT_PUBLIC_* to environment for build process
          echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_CLERK_SIGN_IN_URL=$NEXT_PUBLIC_CLERK_SIGN_IN_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_CLERK_SIGN_UP_URL=$NEXT_PUBLIC_CLERK_SIGN_UP_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=$NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL" >> $GITHUB_ENV

          # Cloudinary
          CLOUDINARY_API_KEY=$(gcloud secrets versions access latest --secret=CLOUDINARY_API_KEY)
          CLOUDINARY_API_SECRET=$(gcloud secrets versions access latest --secret=CLOUDINARY_API_SECRET)
          CLOUDINARY_CLOUD_NAME=$(gcloud secrets versions access latest --secret=CLOUDINARY_CLOUD_NAME)
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=$(gcloud secrets versions access latest --secret=NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME)

          echo "CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY" >> .env.production
          echo "CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET" >> .env.production
          echo "CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME" >> .env.production
          echo "NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=$NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME" >> .env.production
          echo "NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=$NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME" >> $GITHUB_ENV

          # Stripe
          STRIPE_SECRET_KEY=$(gcloud secrets versions access latest --secret=STRIPE_SECRET_KEY)
          STRIPE_WEBHOOK_SECRET=$(gcloud secrets versions access latest --secret=STRIPE_WEBHOOK_SECRET)
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$(gcloud secrets versions access latest --secret=NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY)

          echo "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY" >> .env.production
          echo "STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET" >> .env.production
          echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" >> .env.production
          echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" >> $GITHUB_ENV

          # Razorpay
          RAZORPAY_KEY_ID=$(gcloud secrets versions access latest --secret=RAZORPAY_KEY_ID)
          RAZORPAY_KEY_SECRET=$(gcloud secrets versions access latest --secret=RAZORPAY_KEY_SECRET)
          RAZORPAY_WEBHOOK_SECRET=$(gcloud secrets versions access latest --secret=RAZORPAY_WEBHOOK_SECRET)

          echo "RAZORPAY_KEY_ID=$RAZORPAY_KEY_ID" >> .env.production
          echo "RAZORPAY_KEY_SECRET=$RAZORPAY_KEY_SECRET" >> .env.production
          echo "RAZORPAY_WEBHOOK_SECRET=$RAZORPAY_WEBHOOK_SECRET" >> .env.production

          # OpenAI
          OPENAI_API_KEY=$(gcloud secrets versions access latest --secret=OPENAI_API_KEY)
          echo "OPENAI_API_KEY=$OPENAI_API_KEY" >> .env.production

          # Instagram
          INSTAGRAM_ACCESS_TOKEN=$(gcloud secrets versions access latest --secret=INSTAGRAM_ACCESS_TOKEN)
          echo "INSTAGRAM_ACCESS_TOKEN=$INSTAGRAM_ACCESS_TOKEN" >> .env.production

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run build

      - name: Deploy to App Engine (Staging)
        run: gcloud app deploy app.staging.yaml --quiet --promote
