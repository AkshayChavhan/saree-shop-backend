name: Deploy to Staging

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Fetch secrets and create app.yaml with env vars
        run: |
          # Fetch secrets from Secret Manager
          MASTER_API_KEY=$(gcloud secrets versions access latest --secret=MASTER_API_KEY)
          DATABASE_URL=$(gcloud secrets versions access latest --secret=DATABASE_URL)
          CLERK_SECRET_KEY=$(gcloud secrets versions access latest --secret=CLERK_SECRET_KEY)
          CLERK_WEBHOOK_SECRET=$(gcloud secrets versions access latest --secret=CLERK_WEBHOOK_SECRET)
          CLOUDINARY_API_KEY=$(gcloud secrets versions access latest --secret=CLOUDINARY_API_KEY)
          CLOUDINARY_API_SECRET=$(gcloud secrets versions access latest --secret=CLOUDINARY_API_SECRET)
          CLOUDINARY_CLOUD_NAME=$(gcloud secrets versions access latest --secret=CLOUDINARY_CLOUD_NAME)
          STRIPE_SECRET_KEY=$(gcloud secrets versions access latest --secret=STRIPE_SECRET_KEY)
          STRIPE_WEBHOOK_SECRET=$(gcloud secrets versions access latest --secret=STRIPE_WEBHOOK_SECRET)
          RAZORPAY_KEY_ID=$(gcloud secrets versions access latest --secret=RAZORPAY_KEY_ID)
          RAZORPAY_KEY_SECRET=$(gcloud secrets versions access latest --secret=RAZORPAY_KEY_SECRET)
          RAZORPAY_WEBHOOK_SECRET=$(gcloud secrets versions access latest --secret=RAZORPAY_WEBHOOK_SECRET)

          # Create complete app.staging.yaml with all environment variables
          cat > app.staging.yaml << EOF
          runtime: nodejs20
          service: default
          instance_class: F1

          env_variables:
            NODE_ENV: staging
            PORT: "8080"
            FRONTEND_URL: https://saakie.vercel.app
            MASTER_API_KEY: "${MASTER_API_KEY}"
            DATABASE_URL: "${DATABASE_URL}"
            CLERK_SECRET_KEY: "${CLERK_SECRET_KEY}"
            CLERK_WEBHOOK_SECRET: "${CLERK_WEBHOOK_SECRET}"
            CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY}"
            CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET}"
            CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME}"
            STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
            STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET}"
            RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID}"
            RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET}"
            RAZORPAY_WEBHOOK_SECRET: "${RAZORPAY_WEBHOOK_SECRET}"

          automatic_scaling:
            min_instances: 0
            max_instances: 2

          handlers:
            - url: /.*
              script: auto
              secure: always
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build TypeScript
        run: npm run build

      - name: Deploy to App Engine (Staging)
        run: gcloud app deploy app.staging.yaml --quiet --promote
