name: Deploy to Staging

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Fetch secrets from Secret Manager
        run: |
          # Database
          echo "DATABASE_URL=$(gcloud secrets versions access latest --secret=DATABASE_URL)" >> .env.production

          # Clerk Authentication
          echo "CLERK_SECRET_KEY=$(gcloud secrets versions access latest --secret=CLERK_SECRET_KEY)" >> .env.production
          echo "CLERK_WEBHOOK_SECRET=$(gcloud secrets versions access latest --secret=CLERK_WEBHOOK_SECRET)" >> .env.production
          echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$(gcloud secrets versions access latest --secret=NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY)" >> .env.production
          echo "NEXT_PUBLIC_CLERK_SIGN_IN_URL=$(gcloud secrets versions access latest --secret=NEXT_PUBLIC_CLERK_SIGN_IN_URL)" >> .env.production
          echo "NEXT_PUBLIC_CLERK_SIGN_UP_URL=$(gcloud secrets versions access latest --secret=NEXT_PUBLIC_CLERK_SIGN_UP_URL)" >> .env.production
          echo "NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=$(gcloud secrets versions access latest --secret=NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL)" >> .env.production

          # Cloudinary
          echo "CLOUDINARY_API_KEY=$(gcloud secrets versions access latest --secret=CLOUDINARY_API_KEY)" >> .env.production
          echo "CLOUDINARY_API_SECRET=$(gcloud secrets versions access latest --secret=CLOUDINARY_API_SECRET)" >> .env.production
          echo "CLOUDINARY_CLOUD_NAME=$(gcloud secrets versions access latest --secret=CLOUDINARY_CLOUD_NAME)" >> .env.production
          echo "NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=$(gcloud secrets versions access latest --secret=NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME)" >> .env.production

          # Stripe
          echo "STRIPE_SECRET_KEY=$(gcloud secrets versions access latest --secret=STRIPE_SECRET_KEY)" >> .env.production
          echo "STRIPE_WEBHOOK_SECRET=$(gcloud secrets versions access latest --secret=STRIPE_WEBHOOK_SECRET)" >> .env.production
          echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$(gcloud secrets versions access latest --secret=NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY)" >> .env.production

          # Razorpay
          echo "RAZORPAY_KEY_ID=$(gcloud secrets versions access latest --secret=RAZORPAY_KEY_ID)" >> .env.production
          echo "RAZORPAY_KEY_SECRET=$(gcloud secrets versions access latest --secret=RAZORPAY_KEY_SECRET)" >> .env.production
          echo "RAZORPAY_WEBHOOK_SECRET=$(gcloud secrets versions access latest --secret=RAZORPAY_WEBHOOK_SECRET)" >> .env.production

          # OpenAI
          echo "OPENAI_API_KEY=$(gcloud secrets versions access latest --secret=OPENAI_API_KEY)" >> .env.production

          # Instagram
          echo "INSTAGRAM_ACCESS_TOKEN=$(gcloud secrets versions access latest --secret=INSTAGRAM_ACCESS_TOKEN)" >> .env.production

      - name: Deploy to App Engine (Staging)
        run: gcloud app deploy app.staging.yaml --quiet --promote
