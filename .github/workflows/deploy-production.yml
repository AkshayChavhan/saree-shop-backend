name: Deploy to Production

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Fetch secrets from Secret Manager
        run: |
          # Master API Key
          MASTER_API_KEY=$(gcloud secrets versions access latest --secret=MASTER_API_KEY)
          echo "MASTER_API_KEY=$MASTER_API_KEY" >> .env

          # Database
          DATABASE_URL=$(gcloud secrets versions access latest --secret=DATABASE_URL)
          echo "DATABASE_URL=$DATABASE_URL" >> .env

          # Clerk Authentication
          CLERK_SECRET_KEY=$(gcloud secrets versions access latest --secret=CLERK_SECRET_KEY)
          CLERK_WEBHOOK_SECRET=$(gcloud secrets versions access latest --secret=CLERK_WEBHOOK_SECRET)
          echo "CLERK_SECRET_KEY=$CLERK_SECRET_KEY" >> .env
          echo "CLERK_WEBHOOK_SECRET=$CLERK_WEBHOOK_SECRET" >> .env

          # Cloudinary
          CLOUDINARY_API_KEY=$(gcloud secrets versions access latest --secret=CLOUDINARY_API_KEY)
          CLOUDINARY_API_SECRET=$(gcloud secrets versions access latest --secret=CLOUDINARY_API_SECRET)
          CLOUDINARY_CLOUD_NAME=$(gcloud secrets versions access latest --secret=CLOUDINARY_CLOUD_NAME)
          echo "CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY" >> .env
          echo "CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET" >> .env
          echo "CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME" >> .env

          # Stripe
          STRIPE_SECRET_KEY=$(gcloud secrets versions access latest --secret=STRIPE_SECRET_KEY)
          STRIPE_WEBHOOK_SECRET=$(gcloud secrets versions access latest --secret=STRIPE_WEBHOOK_SECRET)
          echo "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY" >> .env
          echo "STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET" >> .env

          # Razorpay
          RAZORPAY_KEY_ID=$(gcloud secrets versions access latest --secret=RAZORPAY_KEY_ID)
          RAZORPAY_KEY_SECRET=$(gcloud secrets versions access latest --secret=RAZORPAY_KEY_SECRET)
          RAZORPAY_WEBHOOK_SECRET=$(gcloud secrets versions access latest --secret=RAZORPAY_WEBHOOK_SECRET)
          echo "RAZORPAY_KEY_ID=$RAZORPAY_KEY_ID" >> .env
          echo "RAZORPAY_KEY_SECRET=$RAZORPAY_KEY_SECRET" >> .env
          echo "RAZORPAY_WEBHOOK_SECRET=$RAZORPAY_WEBHOOK_SECRET" >> .env

          # Frontend URL (for CORS)
          echo "FRONTEND_URL=https://your-frontend-domain.com" >> .env

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build TypeScript
        run: npm run build

      - name: Deploy to App Engine (Production)
        run: gcloud app deploy app.yaml --quiet --promote
